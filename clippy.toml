# Clippy configuration for Polyglottus
# See https://rust-lang.github.io/rust-clippy/master/

# Allow some lints that are too strict for our codebase
allow = [
    "needless_lifetimes",
    "module_name_repetitions",
    "multiple_crate_versions",
    "implicit_return",
    "too_many_lines",
    "type_complexity",
    "fn_params_excessive_bools",
    "exhaustive_enums",
    "exhaustive_structs",
    "min_ident_chars",
    "missing_const_for_fn",
    "missing_docs_in_private_items",
    "doc_markdown",
    "wildcard_enum_match_arm",
]

