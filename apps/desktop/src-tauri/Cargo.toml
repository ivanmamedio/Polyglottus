[package]
name = "polyglottus-desktop"
version = "0.1.0"
edition = "2021"
description = "Polyglottus Desktop App (Tauri)"

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-sql = { workspace = true }

pgl-app = { workspace = true }
pgl-domain = { workspace = true }
pgl-fmt-epub = { workspace = true }
pgl-fmt-ooxml = { workspace = true }
pgl-fmt-odf = { workspace = true }
pgl-fmt-text = { workspace = true }
pgl-fmt-pdf = { workspace = true }
pgl-fmt-convert = { workspace = true }
pgl-provider-openai = { workspace = true }
pgl-provider-ollama = { workspace = true }
pgl-provider-embedded = { workspace = true }
pgl-ocr = { workspace = true }
pgl-storage = { workspace = true }
pgl-secrets = { workspace = true }
pgl-models = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
specta = { version = "2.0.0-rc.27", features = ["derive"] }
ts-rs = { version = "7", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "polyglottus_desktop"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
