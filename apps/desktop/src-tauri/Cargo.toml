[package]
name = "polyglottus-desktop"
version = "0.1.0"
edition = "2021"
description = "Polyglottus Desktop App (Tauri)"

[dependencies]
tauri = { workspace = true, features = ["cli"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-sql = { workspace = true }

pgl-app = { path = "../../../../app/pgl-app" }
pgl-domain = { path = "../../../../domain/pgl-domain" }
pgl-fmt-epub = { path = "../../../../adapters/formats/pgl-fmt-epub" }
pgl-fmt-ooxml = { path = "../../../../adapters/formats/pgl-fmt-ooxml" }
pgl-fmt-odf = { path = "../../../../adapters/formats/pgl-fmt-odf" }
pgl-fmt-text = { path = "../../../../adapters/formats/pgl-fmt-text" }
pgl-fmt-pdf = { path = "../../../../adapters/formats/pgl-fmt-pdf" }
pgl-fmt-convert = { path = "../../../../adapters/formats/pgl-fmt-convert" }
pgl-provider-openai = { path = "../../../../adapters/providers/pgl-provider-openai" }
pgl-provider-ollama = { path = "../../../../adapters/providers/pgl-provider-ollama" }
pgl-provider-embedded = { path = "../../../../adapters/providers/pgl-provider-embedded" }
pgl-ocr = { path = "../../../../adapters/pgl-ocr" }
pgl-storage = { path = "../../../../adapters/pgl-storage" }
pgl-secrets = { path = "../../../../adapters/pgl-secrets" }
pgl-models = { path = "../../../../adapters/pgl-models" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
specta = { version = "0.8", features = ["derive", "serde"] }
ts-rs = { version = "7", features = ["derive", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "polyglottus_desktop"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]