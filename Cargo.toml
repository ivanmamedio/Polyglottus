[workspace]
resolver = "2"
members = [
    "crates/domain/pgl-domain",
    "crates/app/pgl-app",
    "crates/adapters/formats/pgl-fmt-core",
    "crates/adapters/formats/pgl-fmt-patch",
    "crates/adapters/formats/pgl-fmt-epub",
    "crates/adapters/formats/pgl-fmt-ooxml",
    "crates/adapters/formats/pgl-fmt-odf",
    "crates/adapters/formats/pgl-fmt-text",
    "crates/adapters/formats/pgl-fmt-pdf",
    "crates/adapters/formats/pgl-fmt-convert",
    "crates/adapters/providers/pgl-provider-openai",
    "crates/adapters/providers/pgl-provider-ollama",
    "crates/adapters/providers/pgl-provider-embedded",
    "crates/adapters/pgl-ocr",
    "crates/adapters/pgl-storage",
    "crates/adapters/pgl-secrets",
    "crates/adapters/pgl-models",
    "crates/bins/pgl-cli",
    "crates/bins/pgl-engine",
    "crates/testing/pgl-testkit",
    "apps/desktop/src-tauri",
]

[workspace.dependencies]
# Core
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.5"

# Config
config = { version = "0.14", features = ["toml", "env"] }
figment = { version = "0.11", features = ["toml", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"

# Storage
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "serde_json", "functions", "vtab", "blob"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }

# Crypto/Secrets
keyring = "1.3"
zeroize = "1.7"

# Formats
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize", "namespaces"] }
html5ever = "0.26"
scraper = "0.19"
lopdf = "0.31"
pdfium-render = { version = "0.7", features = ["bind_to_system_library"] }
docx-rs = { version = "0.5", features = ["full"] }
odf = "0.4"

# OCR
ocrs = { version = "0.2", features = ["onnx"] }
ort = { version = "1.16", features = ["load-model", "cuda"] }

# Inference
llama-cpp-2 = { version = "0.10", features = ["standard", "metal", "cuda"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Testing
insta = { version = "1.34", features = ["csv", "json", "ron", "yaml", "serde"] }
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
fake = "3.0"

# Tauri
tauri = { version = "2.0", features = ["cli"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-sql = "2.0"

# Utils
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
percent-encoding = "2.3"
mime = "0.3"
mime_guess = "2.0"
walkdir = "2.5"
ignore = "0.12"
glob = "0.3"
hex = "0.4"
base64 = { version = "0.22", features = ["std"] }

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
nonstandard_style = "warn"
future_incompatible = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
correctness = "warn"
suspicious = "warn"
restriction = "warn"
needless_lifetimes = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
implicit_return = "allow"
too_many_lines = "allow"
type_complexity = "allow"
fn_params_excessive_bools = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
min_ident_chars = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
wildcard_enum_match_arm = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true