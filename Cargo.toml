[workspace]
resolver = "2"
members = [
    "crates/domain/pgl-domain",
    "crates/app/pgl-app",
    "crates/adapters/formats/pgl-fmt-core",
    "crates/adapters/formats/pgl-fmt-patch",
    "crates/adapters/formats/pgl-fmt-epub",
    "crates/adapters/formats/pgl-fmt-ooxml",
    "crates/adapters/formats/pgl-fmt-odf",
    "crates/adapters/formats/pgl-fmt-text",
    "crates/adapters/formats/pgl-fmt-pdf",
    "crates/adapters/formats/pgl-fmt-convert",
    "crates/adapters/providers/pgl-provider-openai",
    "crates/adapters/providers/pgl-provider-ollama",
    "crates/adapters/providers/pgl-provider-embedded",
    "crates/adapters/pgl-ocr",
    "crates/adapters/pgl-storage",
    "crates/adapters/pgl-secrets",
    # "crates/adapters/pgl-models",
    "crates/bins/pgl-cli",
    # "crates/bins/pgl-engine",
    # "crates/testing/pgl-testkit",
    # "apps/desktop/src-tauri",
]

[workspace.dependencies]
# Core
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.5"
async-trait = "0.1"

# Internal crates
pgl-domain = { path = "crates/domain/pgl-domain" }
pgl-app = { path = "crates/app/pgl-app" }
pgl-fmt-core = { path = "crates/adapters/formats/pgl-fmt-core" }
pgl-fmt-patch = { path = "crates/adapters/formats/pgl-fmt-patch" }
pgl-fmt-epub = { path = "crates/adapters/formats/pgl-fmt-epub" }
pgl-fmt-ooxml = { path = "crates/adapters/formats/pgl-fmt-ooxml" }
pgl-fmt-odf = { path = "crates/adapters/formats/pgl-fmt-odf" }
pgl-fmt-text = { path = "crates/adapters/formats/pgl-fmt-text" }
pgl-fmt-pdf = { path = "crates/adapters/formats/pgl-fmt-pdf" }
pgl-fmt-convert = { path = "crates/adapters/formats/pgl-fmt-convert" }
pgl-provider-openai = { path = "crates/adapters/providers/pgl-provider-openai" }
pgl-provider-ollama = { path = "crates/adapters/providers/pgl-provider-ollama" }
pgl-provider-embedded = { path = "crates/adapters/providers/pgl-provider-embedded" }
pgl-ocr = { path = "crates/adapters/pgl-ocr" }
pgl-storage = { path = "crates/adapters/pgl-storage" }
pgl-secrets = { path = "crates/adapters/pgl-secrets" }
# pgl-models = { path = "crates/adapters/pgl-models" }
pgl-cli = { path = "crates/bins/pgl-cli" }
# pgl-engine = { path = "crates/bins/pgl-engine" }
# pgl-testkit = { path = "crates/testing/pgl-testkit" }
polyglottus-desktop = { path = "apps/desktop/src-tauri" }

# Config
config = { version = "0.14", features = ["toml", "env"] }
figment = { version = "0.11", features = ["toml", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"

# Storage
rusqlite = { version = "0.31", features = ["modern_sqlite", "serde_json", "functions", "vtab", "blob"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate", "tls-rustls"] }

# Crypto/Secrets
keyring = { version = "4.2", features = [] }
zeroize = "1.7"

# Formats
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize"] }
html5ever = "0.26"
comrak = { version = "0.20", features = ["default"] }
scraper = "0.19"
lopdf = "0.31"
pdfium-render = { version = "0.9", features = [] }
docx-rs = { version = "0.4" }
lo_odf = { version = "0.5", features = [] }

# OCR
ocrs = { version = "0.13", features = ["onnx"] }
ort = { version = "2.0.0-rc.15", features = ["cuda", "api-17"] }

# Inference
llama-cpp-2 = { version = "0.1.160", features = [] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Testing
insta = { version = "1.34", features = ["csv", "json", "ron", "yaml", "serde"] }
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
fake = "3.0"
csv = "1.3"
regex = "1.10"
md5 = "0.3"

# Tauri
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = "2"

# Utils
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
percent-encoding = "2.3"
mime = "0.3"
mime_guess = "2.0"
walkdir = "2.5"
ignore = "0.12"
glob = "0.3"
hex = "0.4"
base64 = { version = "0.22", features = ["std"] }

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
nonstandard_style = "warn"
future_incompatible = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
correctness = "warn"
suspicious = "warn"
restriction = "warn"
needless_lifetimes = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
implicit_return = "allow"
too_many_lines = "allow"
type_complexity = "allow"
fn_params_excessive_bools = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
min_ident_chars = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
wildcard_enum_match_arm = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true