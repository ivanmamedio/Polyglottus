[package]
name = "pgl-domain"
version = "0.1.0"
edition = "2021"
description = "Domínio puro do Polyglottus: unidades, texto marcado, glossário, guia de estilo, estado de job, regras de QA/segmentação/placeholders (sem I/O, sem async)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polyglottus/polyglottus"
categories = ["text-processing", "localization"]
keywords = ["translation", "books", "documents", "domain"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { workspace = true, features = ["serde"] }
hex = { workspace = true }
csv = { workspace = true }
regex = { workspace = true }
comrak = { version = "0.20", features = ["default"] }
html5ever = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true, features = ["json", "serde"] }

[features]
default = []
proptest = []

[lib]
name = "pgl_domain"
path = "src/lib.rs"