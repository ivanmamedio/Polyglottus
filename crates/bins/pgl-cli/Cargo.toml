[package]
name = "pgl-cli"
version = "0.1.0"
edition = "2021"
description = "CLI do Polyglottus"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pgl-cli"
path = "src/main.rs"

[dependencies]
pgl-app = { workspace = true }
pgl-domain = { workspace = true }
# pgl-fmt-text = { workspace = true }
# pgl-fmt-pdf = { workspace = true }
# pgl-fmt-epub = { workspace = true }
# pgl-fmt-ooxml = { workspace = true }
# pgl-fmt-odf = { workspace = true }
# pgl-fmt-convert = { workspace = true }
pgl-provider-openai = { workspace = true }
# pgl-provider-ollama = { workspace = true }
# pgl-provider-embedded = { workspace = true }
# pgl-ocr = { workspace = true }
# pgl-storage = { workspace = true }
pgl-secrets = { workspace = true }
# pgl-testkit = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
indicatif = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }