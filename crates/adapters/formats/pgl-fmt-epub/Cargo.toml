[package]
name = "pgl-fmt-epub"
version = "0.1.0"
edition = "2021"
description = "Adaptador EPUB (leitura e escrita)"
license = "MIT OR Apache-2.0"

[dependencies]
pgl-fmt-core = { workspace = true }
pgl-app = { workspace = true }
pgl-domain = { workspace = true }
epub = "2"
zip = { workspace = true }
quick-xml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
mime_guess = "2.0"
md5 = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "pgl_fmt_epub"