[package]
name = "pgl-fmt-convert"
version = "0.1.0"
edition = "2021"
description = "Adaptador para formatos de cauda longa via conversores externos (Pandoc, Calibre, LibreOffice)"
license = "MIT OR Apache-2.0"

[dependencies]
pgl-fmt-core = { workspace = true }
pgl-app = { workspace = true }
pgl-domain = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
which = "5.0"
async-trait = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "pgl_fmt_convert"