[package]
name = "pgl-fmt-patch"
version = "0.1.0"
edition = "2021"
description = "Motor de 'patch no lugar' para formatos baseados em ZIP+XML (OPC/ODF/EPUB/FB2)"
license = "MIT OR Apache-2.0"

[dependencies]
pgl-fmt-core = { workspace = true }
pgl-app = { workspace = true }
pgl-domain = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "pgl_fmt_patch"