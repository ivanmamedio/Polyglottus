[package]
name = "pgl-fmt-ooxml"
version = "0.1.0"
edition = "2021"
description = "Adaptador OOXML (DOCX, PPTX, XLSX) via patch engine"
license = "MIT OR Apache-2.0"

[dependencies]
pgl-fmt-core = { workspace = true }
# pgl-fmt-patch = { workspace = true }
pgl-app = { workspace = true }
pgl-domain = { workspace = true }
docx-rs = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
mime_guess = "2.0"
md5 = { workspace = true }
html5ever = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
calamine = "0.22"

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "pgl_fmt_ooxml"