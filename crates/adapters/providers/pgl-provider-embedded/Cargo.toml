[package]
name = "pgl-provider-embedded"
version = "0.1.0"
edition = "2021"
description = "Provedor embutido via llama.cpp (pgl-engine)"
license = "MIT OR Apache-2.0"

[dependencies]
pgl-app = { path = "../../../app/pgl-app" }
pgl-domain = { path = "../../../domain/pgl-domain" }
llama-cpp-2 = { workspace = true, features = ["standard", "metal", "cuda"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
std::path::PathBuf

[dev-dependencies]
insta = { workspace = true }

[lib]
name = "pgl_provider_embedded"