[package]
name = "pgl-provider-openai"
version = "0.1.0"
edition = "2021"
description = "Provedor OpenAI-compatível (OpenAI, llama-server, LM Studio, vLLM, LocalAI, etc.)"
license = "MIT OR Apache-2.0"

[dependencies]
pgl-app = { workspace = true }
pgl-domain = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
mockito = "1.2"
uuid = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lib]
name = "pgl_provider_openai"